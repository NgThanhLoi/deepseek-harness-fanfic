# Opt-in fanfic authoring layer. Paths resolve from the process working directory unless overridden.
- insert:
    - id: fanfic
      name: '@deepseek-ai/dsh-fanfic'

    - id: fanfic-local
      name: '@deepseek-ai/dsh-fanfic-local'
      inject: [fanfic]
      config:
        providerId: local
        canonPackDir: !!js process.env.DSH_FANFIC_CANON_PACK ?? './canon-packs/yishizhizun'
        stateDir: !!js process.env.DSH_FANFIC_STATE_DIR ?? './.dsh-fanfic-state'
        maxSearchResults: 12
        maxExcerptChars: 1800
        maxStructuredRecords: 64
        authorContextMaxEntities: 12
        authorContextSearchLimit: 8
        authorContextCharacterLimit: 8
        authorContextEvidenceLimit: 3
        storyRecentSummaryLimit: 5
        voiceDialogueFragmentLimit: 6
        styleReferenceChapterLimit: 32
        styleSampleExcerptChars: 700
        antiCopyMaxDraftChars: 24000
        antiCopyMaxFindings: 8
        styleDeviationRatio: 0.7
        styleRevisionRequiredRatio: 1.0
        authorContextBranchRecordLimit: 24
        authorContextSourceExcerptLimit: 2
        authorContextMaxJsonChars: 40000
        proseQualityUltraShortHanChars: 8
        proseQualityMaxUltraShortRun: 8
        proseQualityTailUltraShortRatio: 0.6
        proseQualityMinBigramDiversity: 0.58
        proseQualityTailFillerLimit: 6

    - id: tool-fanfic
      name: '@deepseek-ai/dsh-tool-fanfic'
      inject: [fanfic, tools, systemPrompt]
      config:
        defaultSearchLimit: 6
        defaultContextExpansionLimit: 12
        defaultCharacterEvidenceLimit: 5
        defaultVoiceSampleLimit: 4
        defaultStyleSampleLimit: 4
        defaultAntiCopyMinPhraseChars: 24
        defaultAntiCopyMaxFindings: 6
        defaultPowerEvidenceLimit: 4
        defaultEnrichmentBatchSize: 4
        defaultStoryHorizonSize: 5
        maxAuditClaims: 32

    - id: tool-fanfic-distributed
      name: '@deepseek-ai/dsh-tool-fanfic-distributed'
      inject: [fanfic, subagents, tools, systemPrompt]
      config:
        # Set DSH_FANFIC_WORKERS_JSON to distribute roles across independent model/provider quotas.
        # Without it, specialists inherit the Author model while preserving role isolation and parallelism.
        workers: !!js JSON.parse(process.env.DSH_FANFIC_WORKERS_JSON ?? '[{"name":"canon-default","role":"canon","subagentProvider":"spawn","priority":100},{"name":"character-default","role":"character","subagentProvider":"spawn","priority":100},{"name":"story-default","role":"story","subagentProvider":"spawn","priority":100},{"name":"critic-default","role":"critic","subagentProvider":"spawn","priority":100}]')
        failureCooldownMs: 60000
        maxAttemptsPerRole: 3
        maxParallelSpecialists: 3
        cacheTtlMs: 300000
        maxCacheEntries: 64
        packetMaxChars: 12000
        resultMaxChars: 40000
