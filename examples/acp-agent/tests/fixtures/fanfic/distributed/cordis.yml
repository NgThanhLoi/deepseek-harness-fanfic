# Test-only composition of the distributed fanfic Consumer. It inspects the
# real Loader-composed schemas and policy without starting a child/model turn.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: fanfic
  name: '@deepseek-ai/dsh-fanfic'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: tool-fanfic-distributed
  name: '@deepseek-ai/dsh-tool-fanfic-distributed'
  config:
    workers:
      - name: canon-fixture
        role: canon
        subagentProvider: spawn
        priority: 1
      - name: character-fixture
        role: character
        subagentProvider: spawn
        priority: 1
      - name: story-fixture
        role: story
        subagentProvider: spawn
        priority: 1
      - name: critic-fixture
        role: critic
        subagentProvider: spawn
        priority: 1
    failureCooldownMs: 1000
    maxAttemptsPerRole: 2
    maxParallelSpecialists: 3
    cacheTtlMs: 1000
    maxCacheEntries: 8
    packetMaxChars: 4000
    resultMaxChars: 12000
